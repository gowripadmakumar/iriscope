services:
  - type: web
    name: iriscope
    runtime: python
    rootDir: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --chdir backend app:app
    healthCheckPath: /
    autoDeploy: true